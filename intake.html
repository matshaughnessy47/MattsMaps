<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's Maps | Client Intake Form</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <img src="images/logo.png" alt="Matt's Maps Logo" class="logo">

    <div class="buttons">
        <a href="index.html" class="button">← Back to Home</a>
    </div>

    <p class="tagline">
        Tell me about your project and I'll get back to you with options and pricing.
    </p>

    <form id="projectForm">

        <h2>Client Information</h2>

        <label for="clientName">Client Name *</label>
        <input type="text" id="clientName" required>

        <label for="organization">Organization / Agency</label>
        <input type="text" id="organization">

        <label for="email">Email Address *</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" required>

        <h2>Project Location</h2>

        <label for="location">Map Location *</label>
        <input
            type="text"
            id="location"
            placeholder="Address, County, State, Watershed, Coordinates..."
            required
        >

        <h2>Project Type</h2>

        <select id="projectType" required>
            <option value="">Select Project Type</option>
            <option>Custom Cartography</option>
            <option>GIS Analysis</option>
            <option>StoryMap</option>
            <option>Interactive Web Map</option>
            <option>Dashboard Development</option>
            <option>Remote Sensing Analysis</option>
            <option>Habitat Mapping</option>
            <option>Fisheries Analysis</option>
            <option>Spatial Data Processing</option>
            <option>Other</option>
        </select>

        <h2>Desired Aesthetic</h2>

        <select id="aesthetic" required>
            <option value="">Select Desired Aesthetic</option>
            <option>Vintage Cartographic</option>
            <option>National Park Style</option>
            <option>Modern GIS</option>
            <option>Scientific Publication</option>
            <option>USGS Topographic</option>
            <option>Field Atlas / Survey Style</option>
            <option>Minimalist</option>
            <option>Custom</option>
        </select>

        <h2>Primary Deliverable</h2>

        <select id="deliverables" required>
            <option value="">Select Deliverable</option>
            <option>PDF Map</option>
            <option>Print-Ready Poster</option>
            <option>StoryMap</option>
            <option>Interactive Web Map</option>
            <option>Dashboard</option>
            <option>GIS Data Package</option>
            <option>Technical Report</option>
        </select>

        <h2>Desired Delivery Date</h2>

        <input type="date" id="deliveryDate">

        <h2>Project Budget</h2>

        <select id="budget" required>
            <option value="">Select Budget Range</option>
            <option>Under $250</option>
            <option>$250 - $500</option>
            <option>$500 - $1,000</option>
            <option>$1,000 - $2,500</option>
            <option>$2,500 - $5,000</option>
            <option>$5,000+</option>
        </select>

        <h2>Additional Notes</h2>

        <textarea
            id="notes"
            rows="8"
            placeholder="Tell me about your project goals, audience, intended map use, preferred styles, available data, and any examples you'd like me to reference."
        ></textarea>

        <button type="submit">
            Submit Project Request
        </button>

        <div id="statusMessage"></div>

    </form>

</div>

<script>

document.getElementById("projectForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = {

        clientName: document.getElementById("clientName").value,
        organization: document.getElementById("organization").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        location: document.getElementById("location").value,

        projectType: document.getElementById("projectType").value,

        aesthetic: document.getElementById("aesthetic").value,

        deliverables: document.getElementById("deliverables").value,

        deliveryDate: document.getElementById("deliveryDate").value,

        budget: document.getElementById("budget").value,

        notes: document.getElementById("notes").value
    };

    const status = document.getElementById("statusMessage");

    try {

      await fetch(
    "https://script.google.com/macros/s/AKfycbyKt3xWwFdV4825_E7PZ5RVoH6Ln67OarAoerk1touPtzESLAG3Pz_aqL2hfj-H2nw/exec",
    {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(formData)
    }
);

status.innerHTML =
"<p style='color:green; font-weight:bold;'>✓ Thank you! Your project request has been submitted.</p>";

this.reset();

    

    } catch (error) {

        status.innerHTML =
        "<p style='color:red; font-weight:bold;'>Submission failed. Please try again.</p>";

    }

});

</script>

</body>
</html>
